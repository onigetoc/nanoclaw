# Agent Registry for EureClaw
# Auto-discovered by the orchestrator at session start
# Run 'bun run scripts/sync-agents-registry.ts' to regenerate

agents:
  - name: researcher
    file: researcher.md
    description: 'Web research specialist — searches, fetches, compiles results with links'
    mode: subagent
    trigger_keywords:
      - research
      - search
      - news
      - find
      - look up
      - latest
      - current
      - cherche
      - nouvelles
      - actualités

  - name: planner
    file: planner.md
    description: 'Decomposes complex tasks into executable subtask plans'
    mode: subagent
    trigger_keywords:
      - plan
      - decompose
      - break down
      - strategy

  - name: summarizer
    file: summarizer.md
    description: 'Synthesizes information from multiple sources into structured summaries'
    mode: subagent
    trigger_keywords:
      - summarize
      - summary
      - synthesize
      - résume

  - name: task-planner
    file: task-planner.md
    description: 'Creates task plans in workspaces/{workspace}/tasks/'
    mode: subagent
    trigger_keywords:
      - create task
      - task plan
      - plan task
      - crée une tâche

  - name: task-executor
    file: task-executor.md
    description: 'Executes task plans from workspaces/{workspace}/tasks/'
    mode: subagent
    trigger_keywords:
      - execute task
      - run task
      - exécute

orchestrator:
  auto_discover: true
  registry_file: .opencode/agents-registry.yaml
  fallback_agent: general
